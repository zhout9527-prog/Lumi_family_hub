[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-familyhub"
version = "0.1.0"
description = "Local-first family media and learning control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "pydantic-settings>=2.10,<3",
]

[tool.setuptools.packages.find]
include = ["familyhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

