[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-familyhub"
version = "0.4.0"
description = "Local-first family media and learning control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "alembic>=1.16,<2",
  "yt-dlp==2026.8.19",
  "imageio-ffmpeg==0.6.0",
]

[tool.setuptools.packages.find]
include = ["familyhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
